[project]
name = "gait-evolution"
version = "0.1.0"
description = "Evolving statically stable, low-effort gaits for a 12-servo quadruped."
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
viz = ["matplotlib>=3.8", "pillow>=10"]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["evolve"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
